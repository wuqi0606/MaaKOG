name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "interface.json"
      - "tools/install.py"
      - "tools/requirements.txt"
      - "assets/**"
      - "resource/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "interface.json"
      - "tools/install.py"
      - "tools/requirements.txt"
      - "assets/**"
      - "resource/**"
      - "**.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade maafw --pre

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs resource --exclude-dirs resource/announcement --interface-files interface.json
